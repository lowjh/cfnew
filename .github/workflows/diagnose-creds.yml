name: Diagnose CF Credentials

# 只做诊断，不部署任何东西。
# 判定 CF_API_TOKEN 的实际形态（API Token / Global API Key / 带空白），
# 并对 Cloudflare API 试几种认证方式，打印 HTTP 状态与错误码。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 诊断 Cloudflare 凭据
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: node scripts/diagnose-creds.mjs
