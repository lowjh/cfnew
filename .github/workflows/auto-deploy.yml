name: Auto Deploy CFnew

# 上游 byJoey/cfnew 一有更新，本 action 自动拉取最新产物并部署到 Cloudflare Pages。
#
# 设计要点：
#  - 产物发现靠 GitHub tree API + 规则挑选，不写死文件名（上游改名不会翻车）
#  - 幂等判断用 blob SHA（内容哈希），改名与内容更新彻底解耦
#  - Cloudflare 响应校验 success，失败即 exit 1（不再"假绿"）
#  - 状态文件只在部署成功后写入
on:
  schedule:
    - cron: '17 */6 * * *' # 每 6 小时，避开整点高峰
  workflow_dispatch:

concurrency:
  group: cfnew-deploy
  cancel-in-progress: false

jobs:
  sync-deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'lowjh/cfnew'
    permissions:
      contents: write # 用于提交状态文件
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 同步上游并部署
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PAGES_PROJECT: cfnewup-dic
        run: node scripts/sync-deploy.mjs

      - name: 提交状态文件
        run: |
          if git diff --quiet -- .upstream-state.json; then
            echo "状态文件无变化，跳过提交。"
            exit 0
          fi
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .upstream-state.json
          git commit -m "chore: 更新上游同步状态 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # 去掉 checkout 注入的 extraheader，避免用错凭据 push
          git config --unset-all http.https://github.com/.extraheader || true
          git push
